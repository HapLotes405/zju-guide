name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: msewiki
          POSTGRES_PASSWORD: msewiki
          POSTGRES_DB: msewiki_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Unit & integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://msewiki:msewiki@localhost:5432/msewiki_test
          JWT_SECRET: test-secret

      - name: Build
        run: pnpm build
        env:
          DATABASE_URL: postgresql://msewiki:msewiki@localhost:5432/msewiki_test

      - name: Upload build artifacts
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: .next/
